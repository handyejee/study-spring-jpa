services:
  mysql:
    image: mysql:8.0
    container_name: bookdb-container
    restart: always
    ports:
      - "3311:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: bookdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpw
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: